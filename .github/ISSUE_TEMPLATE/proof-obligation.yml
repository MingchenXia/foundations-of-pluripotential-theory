name: Proof or dependency obligation
description: Track an exact mathematical gap with scope and source evidence.
title: "[Proof] "
body:
  - type: input
    id: task
    attributes:
      label: Chapter / task ID
    validations:
      required: true
  - type: textarea
    id: statement
    attributes:
      label: Exact hypotheses and conclusion
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: Missing implication, exceptional case or dependency
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source version, page / theorem / TeX label and normalization
  - type: textarea
    id: verification
    attributes:
      label: Proof reconstruction and first / second review evidence
